<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>localStorage Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
  </head>
  <body
    class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100"
  >
    <div class="mx-auto max-w-5xl px-6 py-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold">localStorage Users</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400">
            Save, update, delete users + theme preference
          </p>
        </div>
        <div class="rounded-2xl bg-white p-4 shadow-lg dark:bg-slate-900">
          <label for="themeSelect" class="text-sm font-medium">Theme:</label>
          <select
            id="themeSelect"
            class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200 dark:focus:border-blue-400 dark:focus:ring-blue-900"
          >
            <option value="light">Light Mode</option>
            <option value="dark">Dark Mode</option>
          </select>
        </div>
      </div>

      <div class="mt-6 rounded-2xl bg-white p-6 shadow-lg dark:bg-slate-900">
        <h2 class="text-xl font-semibold">Add / Update User</h2>
        <form
          id="userForm"
          class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-[1fr_1fr_auto_auto]"
        >
          <input
            id="nameInput"
            type="text"
            placeholder="User name"
            required
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200 dark:focus:border-blue-400 dark:focus:ring-blue-900"
          />
          <input
            id="emailInput"
            type="email"
            placeholder="User email"
            required
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200 dark:focus:border-blue-400 dark:focus:ring-blue-900"
          />
          <button
            type="submit"
            id="saveButton"
            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow hover:bg-blue-700"
          >
            Add User
          </button>
          <button
            type="button"
            id="cancelButton"
            class="rounded-lg bg-slate-500 px-4 py-2 text-sm font-semibold text-white shadow hover:bg-slate-600"
            hidden
          >
            Cancel
          </button>
        </form>
      </div>

      <div
        id="usersContainer"
        class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
