name: CI

on:
  push:
    branches: [main]
    paths:
      - 'fake_ecommerce_nextjs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'fake_ecommerce_nextjs/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: fake_ecommerce_nextjs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fake_ecommerce_nextjs/package-lock.json

      - run: npm ci

      - run: npm run lint
